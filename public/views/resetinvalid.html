<!doctype html>
<html lang="en">
    <head>
        <title>Collab - Reset Link Invalid</title>
        <link rel="shortcut icon" href="../images/collab.png" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Collab - Password reset failed page" />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="min-h-screen flex flex-col bg-gray-50 font-sans text-gray-900">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <main class="flex-grow flex flex-col justify-center items-center px-4 py-12">
            <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 space-y-6 text-center">
                <h1 class="text-3xl font-bold text-red-600 mb-4">Reset Link Invalid</h1>
                <p class="text-lg text-gray-700 mb-6">
                    The password reset link is invalid or has expired.<br />
                    Please request a new password reset.
                </p>
                <a
                    href="/forget"
                    class="inline-block px-6 py-3 bg-red-600 text-white rounded-xl font-semibold text-lg hover:bg-red-700 transition duration-300 shadow-lg"
                >
                    Request New Reset Link
                </a>
            </div>
        </main>

        <div id="footer-placeholder"></div>

        <script defer src="../js/layoutLoader.js"></script>
        <script defer src="../js/Auth.js"></script>
    </body>
</html>
