<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title id="title">Collab - Sign Up</title>
        <link id="icon" rel="shortcut icon" href="../images/collab.png" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/collab.png" />

        <meta
            id="description"
            name="description"
            content="Collab powered by WebRTC and mediasoup, Real-time Simple Secure Fast video calls, messaging and screen sharing capabilities in the browser."
        />
        <meta
            id="keywords"
            name="keywords"
            content="webrtc, collab, mediasoup, mediasoup-client, self hosted, voip, sip, real-time communications, chat, messaging, meet, webrtc stun, webrtc turn, webrtc p2p, webrtc sfu, video meeting, video chat, video conference, multi video chat, multi video conference, peer to peer, p2p, sfu, rtc, alternative to, zoom, microsoft teams, google meet, jitsi, meeting"
        />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        />
        <style>
            .app-font {
                font-family:
                    Inter,
                    'IBM Plex Sans',
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    'Helvetica Neue',
                    Arial,
                    'Noto Sans',
                    'Apple Color Emoji',
                    'Segoe UI Emoji',
                    'Segoe UI Symbol',
                    'Noto Color Emoji';
            }
        </style>
        <link rel="icon" href="../images/collab.png" />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="min-h-screen flex flex-col bg-white font-sans app-font antialiased text-gray-900">
        <div id="header-placeholder"></div>

        <div class="flex-1 flex flex-col justify-center items-center px-4 sm:px-6 md:px-8 py-12 sm:py-16">
            <a
                href="/"
                class="text-3xl sm:text-4xl font-extrabold tracking-tight text-blue-700 hover:text-blue-800 transition animate__animated animate__fadeIn"
            >
                Welcome to Collab!
            </a>
            <h2 class="text-xl sm:text-2xl font-semibold tracking-tight text-center text-slate-900 mb-5">
                Create your account
            </h2>

            <div
                class="w-full max-w-md bg-white rounded-2xl shadow-md p-6 sm:p-8 space-y-6 animate__animated animate__fadeIn"
            >
                <form id="signupForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                        <input
                            type="text"
                            id="username"
                            placeholder="name"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            required
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="email"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            required
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="e.g., 017XXXXXXXX"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            required
                        />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            required
                        />
                    </div>

                    <button
                        type="submit"
                        id="signupButton"
                        class="w-full py-3 px-4 bg-blue-600 text-white rounded-xl font-semibold text-base sm:text-lg hover:bg-blue-700 transform hover:scale-[1.01] transition-all duration-300 shadow-lg"
                    >
                        Sign Up
                    </button>

                    <div
                        id="signupError"
                        class="hidden text-red-700 bg-red-100 border border-red-400 px-4 py-3 rounded-lg mb-4 text-sm text-center"
                    ></div>
                </form>

                <!-- Resend verification -->
                <p id="resendContainer" class="text-sm text-center text-gray-600 mt-2 hidden">
                    Didn't receive verification email?
                    <button id="resendLink" class="text-blue-600 hover:underline font-semibold">Resend Link</button>
                </p>

                <p class="text-sm text-center text-gray-600">
                    Already have an account?
                    <a href="/login" class="text-blue-600 hover:underline">Log in</a>
                </p>
            </div>
        </div>

        <div id="footer-placeholder"></div>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script defer src="../js/signup.js"></script>
        <script defer src="../js/layoutLoader.js"></script>
        <script defer src="../js/Auth.js"></script>
    </body>
</html>
