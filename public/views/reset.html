<!doctype html>
<html lang="en">
    <head>
        <title>Collab - Reset Password</title>
        <link rel="shortcut icon" href="../images/collab.png" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    </head>
    <body class="min-h-screen flex flex-col bg-gray-50 font-sans text-gray-900">
        <!-- Header -->
        <div id="header-placeholder"></div>

        <!-- Main content -->
        <div class="flex-1 flex flex-col justify-center items-center px-4 py-12">
            <!-- Logo -->
            <a
                href="/"
                class="text-3xl font-bold text-blue-600 mb-10 hover:text-blue-700 transition animate__animated animate__fadeIn"
            >
                Collab
            </a>

            <!-- Reset Password Card -->
            <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 space-y-6 animate__animated animate__fadeIn">
                <h2 class="text-2xl font-bold text-center text-gray-800">Reset Your Password</h2>
                <p class="text-sm text-gray-500 text-center">Enter a new password to continue.</p>

                <!-- Success/Error Alerts -->
                <div
                    id="resetSuccess"
                    class="hidden px-4 py-3 rounded-lg text-sm text-green-700 bg-green-100 border border-green-400 text-center"
                ></div>
                <div
                    id="resetError"
                    class="hidden px-4 py-3 rounded-lg text-sm text-red-700 bg-red-100 border border-red-400 text-center"
                ></div>

                <!-- Form -->
                <form id="resetForm" class="space-y-5 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                        <input
                            type="password"
                            name="password"
                            required
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            placeholder="••••••••"
                        />
                    </div>

                    <button
                        type="submit"
                        class="w-full py-3 px-4 bg-blue-600 text-white rounded-xl font-semibold text-lg hover:bg-blue-700 transform hover:scale-105 transition-all duration-300 shadow-lg"
                    >
                        Reset Password
                    </button>
                </form>

                <p class="text-sm text-gray-600 text-center mt-4">
                    Remembered your password?
                    <a href="/login" class="text-blue-600 hover:underline font-medium">Login</a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div id="footer-placeholder"></div>

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script defer src="../js/ResetPassword.js"></script>
        <script defer src="../js/layoutLoader.js"></script>
        <script defer src="../js/Auth.js"></script>
    </body>
</html>
