<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Collab - 404 Page not found</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
        <link rel="icon" href="../images/collab.png" />
        <link rel="apple-touch-icon" href="../images/collab.png" />

        <!-- JS Scripts -->
        <script defer src="../js/Brand.js"></script>
        <script async src="../js/Umami.js"></script>
    </head>

    <body class="min-h-screen flex flex-col bg-gray-50 font-sans antialiased text-gray-900 sm:px-10">
        <!-- Wrapper -->
        <div class="flex-1">
            <div class="max-w-screen-xl mx-auto px-4">
                <!-- Header -->
                <header class="py-8 flex justify-between items-center">
                    <a
                        href="/"
                        class="text-3xl font-semibold text-blue-600 hover:text-blue-700 transition duration-300"
                    >
                        Collab
                    </a>
                </header>

                <!-- 404 Section -->
                <section class="flex flex-col items-start py-20 animate__animated animate__fadeInUp">
                    <div class="text-left space-y-6">
                        <h1 class="text-5xl font-extrabold leading-tight">
                            Oops!<br />
                            404 - PAGE NOT FOUND
                        </h1>
                        <p id="message" class="text-lg text-gray-700"></p>
                        <p class="text-lg text-gray-700">This page you are looking not exist.</p>
                        <a
                            href="/"
                            class="inline-block px-6 py-3 bg-blue-600 text-white font-semibold rounded-xl text-lg hover:bg-blue-700 transform hover:scale-105 transition-all duration-300 shadow-lg"
                        >
                            GO TO HOMEPAGE
                        </a>
                    </div>
                </section>
            </div>
        </div>

        <!-- Footer -->
        <footer class="py-8 bg-gray-50 text-center text-black mt-auto">
            <p>&copy; 2025 Collab - All rights reserved</p>
        </footer>
    </body>
</html>
