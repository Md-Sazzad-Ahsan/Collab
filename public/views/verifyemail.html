<!doctype html>
<html lang="en">
<head>
    <title>Collab - Email Verified</title>
    <link rel="shortcut icon" href="../images/collab.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Collab - Email verification success page" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gray-50 font-sans text-gray-900">
    <header class="w-full bg-white shadow-md">
        <div class="max-w-screen-xl mx-auto py-6 px-4 flex justify-between items-center sm:px-10">
            <a href="/" class="text-3xl font-semibold text-blue-600 hover:text-blue-700 transition duration-300">Collab</a>
        </div>
    </header>

    <main class="flex-grow flex flex-col justify-center items-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 space-y-6 text-center">
            <h1 class="text-3xl font-bold text-green-600 mb-4">Email Verified!</h1>
            <p class="text-lg text-gray-700 mb-6">
                Thank you for verifying your email.<br />
                You can now log in to your account.
            </p>
            <a href="/login" 
               class="inline-block px-6 py-3 bg-blue-600 text-white rounded-xl font-semibold text-lg hover:bg-blue-700 transition duration-300 shadow-lg">
               Go to Login
            </a>
        </div>
    </main>

    <footer class="text-gray-700 py-8 max-w-screen-xl mx-auto w-full sm:px-10 text-center">
        <p class="text-sm">&copy; 2025 MiroTalk SFU, all rights reserved</p>
    </footer>

    <script defer src="../js/VerifyEmail.js"></script>
</body>
</html>
