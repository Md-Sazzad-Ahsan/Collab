<html>
    <head>
        <!-- Title and Icon -->

        <title id="title">Collab - Create your Room name and start the new call.</title>
        <link id="icon" rel="shortcut icon" href="../images/collab.png" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/collab.png" />

        <!-- Meta Information -->

        <meta
            id="description"
            name="description"
            content="Collab powered by WebRTC and mediasoup, Real-time Simple Secure Fast video calls, messaging and screen sharing capabilities in the browser."
        />
        <meta
            id="keywords"
            name="keywords"
            content="webrtc, collab, mediasoup, mediasoup-client, self hosted, voip, sip, real-time communications, chat, messaging, meet, webrtc stun, webrtc turn, webrtc p2p, webrtc sfu, video meeting, video chat, video conference, multi video chat, multi video conference, peer to peer, p2p, sfu, rtc, alternative to, zoom, microsoft teams, google meet, jitsi, meeting"
        />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
        <link id="icon" rel="shortcut icon" href="../images/collab.png" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/collab.png" />

        <!-- Js scripts -->
        <script defer src="../js/Brand.js"></script>
        <script async src="../js/Umami.js"></script>

        <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"></script>
        <script src="https://unpkg.com/animejs@3.0.1/lib/anime.min.js"></script>
        <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="min-h-screen flex flex-col bg-gray-50 font-sans antialiased text-gray-900">

        <!-- Header with Text Logo -->
        <header class="w-full bg-white shadow-md">
            <div class="max-w-screen-xl mx-auto py-6 px-4 flex justify-between items-center sm:px-10">
                <!-- Logo Section -->
                <div class="flex items-center space-x-12">
                    <a href="/" class="text-3xl font-semibold text-blue-600 hover:text-blue-700 transition duration-300">
                        Collab
                    </a>
                    <nav class="hidden md:flex space-x-8">
                        <a href="/" class="text-lg font-medium text-gray-700 hover:text-blue-600 transition duration-300">Home</a>
                        <a href="/features" class="text-lg font-medium text-gray-700 hover:text-blue-600 transition duration-300">Features</a>
                        <a href="/pricing" class="text-lg font-medium text-gray-700 hover:text-blue-600 transition duration-300">Pricing</a>
                        <a href="/contact" class="text-lg font-medium text-gray-700 hover:text-blue-600 transition duration-300">Contact</a>
                    </nav>
                </div>

                <!-- Logout Button -->
                <button
                    id="logoutButton"
                    class="px-4 py-2 bg-red-50 text-red-600 font-semibold rounded-lg text-lg border border-red-600 transition duration-300 ease-in-out shadow-sm hover:bg-red-100 hover:text-red-700 hover:shadow-md hidden"
                >
                    Logout
                </button>
            </div>
        </header>
        <div class="flex-1">
            <div class="max-w-screen-xl mx-auto px-4 sm:px-10">
                <!-- Hero Section -->
                <section class="flex flex-col lg:flex-row items-start py-20 space-y-12 lg:space-y-0">
                    <div class="lg:w-2/3 text-left space-y-6 animate__animated animate__fadeIn">
                        <h1 class="text-5xl font-extrabold text-gray-900 leading-tight">
                            Collab
                            <span class="text-blue-600">— Seamless</span> Video Communication
                        </h1>
                        <p class="text-lg text-gray-600 max-w-xl lg:mx-0 text-left">
                            No downloads. No delays. Just click, name a room, and connect.
                        </p>
                        <div class="flex flex-col sm:flex-row items-start sm:space-x-4 space-y-4 sm:space-y-0">
                            <input
                                id="roomName"
                                class="w-full sm:w-auto px-5 py-3 text-lg border border-gray-300 rounded-xl shadow focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                type="text"
                                placeholder="Enter room name"
                                maxlength="36"
                            />
                            <button
                                id="genRoomButton"
                                title="Generate Room Name"
                                class="mt-3 sm:mt-0 w-12 h-12 flex items-center justify-center rounded-xl bg-white border border-gray-300 hover:bg-blue-100 text-blue-600 transition duration-200 shadow-sm"
                            >
                                <i class="fas fa-random text-lg"></i>
                            </button>
                            <button
                                id="joinRoomButton"
                                class="mt-3 sm:mt-0 px-6 py-3 bg-blue-600 text-white font-semibold rounded-xl text-lg hover:bg-blue-700 transform hover:scale-105 transition-all duration-300 shadow-lg"
                            >
                                Join Room
                            </button>
                        </div>

                        <div id="lastRoomContainer" class="text-sm text-gray-600 mt-3 hidden">
                            <span class="font-medium">Your recent room:</span>
                            <a id="lastRoom" href="#" class="text-blue-600 hover:underline font-medium"></a>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <!-- Footer -->
        <footer id="footer" class="site-footer text-gray-700 py-8 max-w-screen-xl mt-auto mx-auto w-full sm:px-10">
            <div class="container mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center">
                    <div class="footer-copyright text-center md:text-left">
                        <p class="text-sm">&copy; 2025 MiroTalk SFU, all rights reserved</p>
                    </div>
                    <ul class="footer-links list-reset flex flex-col md:flex-row mt-4 md:mt-0">
                        <li class="mr-6">
                            <a href="/about" class="text-gray-600 hover:text-blue-600">About</a>
                        </li>
                        <li class="mr-6">
                            <a href="/privacy" class="text-gray-600 hover:text-blue-600">Privacy Policy</a>
                        </li>
                        <li>
                            <a href="/api/v1/docs/" class="text-gray-600 hover:text-blue-600">Rest API</a>
                        </li>
                    </ul>
                </div>
            </div>
        </footer>
        <!-- Scripts -->
        <script defer src="../js/Utils.js"></script>
        <script defer src="../js/Common.js"></script>
        <script defer src="../js/Landing.js"></script>
        <script defer src="../js/Logout.js"></script>
        <script async defer src="https://buttons.github.io/buttons.js"></script>
        <script src="../js/Auth.js"></script>
    </body>
</html>
